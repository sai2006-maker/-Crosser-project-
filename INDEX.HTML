<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<Style>
    body, html, #particles{
        margin: 0;
        width: 100%;
        height: 100%;
    }
    #particles{
        overflow: hidden;
    }
    #particles canvas{
        display: block;
        position: fixed;
        top: 0;
        z-index: -1;
    }

</Style>
<body>
    <div id="particles">
        <canvas></canvas>
    </div>
    <script
    import {module}
        type = "module">
        //import the particles using the three js hyperlinks
        import {particlesCursor} from 'https://unpkg.com/threejs-toys@0.0.8/build/threejs-toys.module.cdn.min.js'
        const pc = particlesCursor ({
            el: document.getElementById('particles'),
            gpgpuSize: 512,
            colors: [0x00fffc,0x5600ff],
            color: 0xff0001,
            coordScale:0.5,
            noiseIntensity: 0.005,
            noiseTimeCoef: 0.0001,
            pointSize: 2,
            PointDecay:0.0054,
            sleepRadiusx: 250,
            sleepRadiusy: 250,

        });
    </script>
</body>
</html>
